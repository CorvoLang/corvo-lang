# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny crates with known security vulnerabilities
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Transitive unmaintained crates without a safe bump path are ignored explicitly.
ignore = [
    # rustls-pemfile is archived; pulled by tcp-stream → lapin. Migrate when lapin drops it.
    { id = "RUSTSEC-2025-0134", reason = "transitive via lapin/tcp-stream; no safe upgrade available yet" },
]

[licenses]
# Allow common open-source licenses used by the Rust ecosystem
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    # CDLA-Permissive-2.0 — webpki-roots certificate bundle license (permissive)
    "CDLA-Permissive-2.0",
    # MPL-2.0 — weak file-level copyleft (option-ext via directories); Compatible with MIT
    # as long as modified MPL files remain under MPL. We do not modify option-ext.
    "MPL-2.0",
]

[bans]
# Warn on duplicate versions of the same crate (normal in the ecosystem)
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
