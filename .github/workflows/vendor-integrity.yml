name: Vendor Integrity

# Prove that vendored crates match Cargo.lock and that offline builds work.
on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - ".cargo/config.toml"
      - "deny.toml"
      - ".github/workflows/vendor-integrity.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - ".cargo/config.toml"
      - "deny.toml"
      - ".github/workflows/vendor-integrity.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "true"

jobs:
  offline-build:
    name: Offline build (vendored)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify vendor directory exists
        run: |
          test -d vendor
          test -f .cargo/config.toml
          grep -q 'replace-with = "vendored-sources"' .cargo/config.toml

      - name: Offline build (all features)
        run: cargo build --offline --all-features

      - name: Offline test compile (all features)
        run: cargo test --offline --all-features --no-run

  vendor-sync:
    name: Vendor matches Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Network is required only to re-vendor into a temp dir for comparison.
      - name: Re-vendor into scratch and diff
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          set -euo pipefail
          SCRATCH="$(mktemp -d)"
          # Temporarily allow crates.io so cargo vendor can fetch for comparison.
          mv .cargo/config.toml .cargo/config.toml.bak
          cargo vendor --versioned-dirs "$SCRATCH/vendor"
          mv .cargo/config.toml.bak .cargo/config.toml
          # Compare tree (ignore mtime). Fail if committed vendor drifted from lock.
          diff -ru vendor "$SCRATCH/vendor"

  deny:
    name: cargo deny (licenses / bans / advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans
