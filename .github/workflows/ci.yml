name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    permissions:
      contents: read
    name: Format
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    permissions:
      contents: read
    name: Clippy
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    permissions:
      contents: read
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Run tests
        env:
          CORVO_LANG_LOCAL_PATH: ${{ github.workspace }}
        run: cargo test --all-features
      - name: Run pex unit tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test pex --lib --all-features
      - name: Run run_test integration tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --test run_test_integration --all-features

  oxide:
    permissions:
      contents: read
    name: Oxide transpilation
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Run oxide integration tests
        env:
          CORVO_LANG_LOCAL_PATH: ${{ github.workspace }}
        run: cargo test --test oxide_transpilation_test --all-features

  lint-examples:
    permissions:
      contents: read
    name: Lint examples
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build corvo CLI
        run: cargo build --bin corvo
      - name: Lint all example scripts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in examples/*.corvo; do
            echo "Linting ${f}"
            ./target/debug/corvo --lint "${f}"
          done

  smoke-unix:
    permissions:
      contents: read
    name: Smoke (Unix examples)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build corvo and smoke pex + run_test examples
        run: |
          cargo build --bin corvo
          ./target/debug/corvo examples/pex_example.corvo
          ./target/debug/corvo --run-test examples/run_test_example.corvo
