[package]
name = "corvo-lang"
version = "0.1.0"
edition = "2021"
authors = ["Corvo Team"]
description = "A modern programming language for scripting and batch programming"
license = "MIT"
repository = "https://github.com/anomalyco/corvo-lang"
keywords = ["language", "scripting", "compiler", "interpreter"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[lib]
name = "corvo_lang"
path = "src/lib.rs"

[[bin]]
name = "corvo"
path = "src/main.rs"

[dependencies]
miette = { version = "5.10", features = ["fancy"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = "0.4"
hostname = "0.4"
directories = "5.0"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
base64 = "0.22"

# Optional heavy dependencies (gated behind features)
serde_yaml = { version = "0.9", optional = true }
csv = { version = "1.3", optional = true }
quick-xml = { version = "0.31", features = ["serialize"], optional = true }
uuid = { version = "1.6", features = ["v4", "serde"], optional = true }
aes-gcm = { version = "0.10", optional = true }
sha2 = { version = "0.11", optional = true }
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
blake2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"], optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }
dns-lookup = { version = "2.0", optional = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"], optional = true }
handlebars = { version = "6.4.0", optional = true }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
], optional = true }
lapin = { version = "3", optional = true }
futures-util = { version = "0.3", optional = true }

[dependencies.rustyline]
version = "12.0"
optional = true

[dev-dependencies]
tempfile = "3.9"
pretty_assertions = "1.4"
proptest = "1.4"
fs4 = "0.13"

[features]
default = ["repl", "full-stdlib"]
repl = ["rustyline"]

# All stdlib modules bundled (current default behavior)
full-stdlib = [
    "stdlib-http",
    "stdlib-crypto",
    "stdlib-db",
    "stdlib-amqp",
    "stdlib-notifications",
    "stdlib-llm",
    "stdlib-template",
    "stdlib-dns",
    "stdlib-csv",
    "stdlib-xml",
    "stdlib-yaml",
    "stdlib-env",
    "stdlib-hcl",
    "stdlib-net",
    "stdlib-pex",
]

# Core modules (always available, no heavy deps):
#   sys, os, fs, math, re, args, json, time

# Heavy optional modules
stdlib-http = ["dep:reqwest"]
stdlib-crypto = ["dep:uuid", "dep:aes-gcm", "dep:sha2", "dep:md-5", "dep:sha1", "dep:blake2", "dep:hmac"]
stdlib-db = ["dep:sqlx", "dep:tokio"]
stdlib-amqp = ["dep:lapin", "dep:tokio", "dep:futures-util"]
stdlib-notifications = ["dep:lettre", "dep:reqwest"]
stdlib-llm = ["dep:reqwest"]
stdlib-template = ["dep:handlebars"]
stdlib-dns = ["dep:dns-lookup"]
stdlib-csv = ["dep:csv"]
stdlib-xml = ["dep:quick-xml"]
stdlib-yaml = ["dep:serde_yaml"]
stdlib-env = []
stdlib-hcl = []
stdlib-net = []
stdlib-pex = ["dep:rexpect"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
uzers = "0.11"
rexpect = { version = "0.7", optional = true }
